name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt -r requirements-eval.txt
      - name: Lint and compile
        run: |
          ruff check .
          python -m compileall -q easd tests train.py predict.py evaluate.py inspect_model.py
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Full-resolution smoke test
        run: python train.py --smoke-test --device cpu --output logs/ci
